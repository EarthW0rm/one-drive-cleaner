# CodeQL (plan 11.5): Python, JavaScript/TypeScript e Actions, sem build (build-mode none).
# O job se chama `CodeQL`, o nome do status check exigido pelo ruleset.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "29 6 * * 1" # segundas, 06:29 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # publica os resultados na aba Security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python,javascript-typescript,actions
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
