# SPDX-License-Identifier: GPL-3.0-only
# gitleaks no histórico completo (plan 11.3). O binário é fixado por versão e SHA-256 (sem a
# gitleaks-action, que exige licença em organizações). Regras e allowlist: .gitleaks.toml.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 4 * * 1" # segundas, 04:43 UTC
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" gitleaks
      - name: gitleaks detect (histórico completo)
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner --verbose'
