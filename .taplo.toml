# TOML do repositório (plan 10.6): sintaxe e formatação estáveis, sem reordenar chaves.
include = ["pyproject.toml", ".gitleaks.toml", ".taplo.toml"]

[formatting]
indent_string = "    "
column_width = 100
array_auto_expand = false
array_auto_collapse = false
align_entries = false
reorder_keys = false
reorder_arrays = false
allowed_blank_lines = 1
