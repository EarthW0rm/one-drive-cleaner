# SPDX-License-Identifier: GPL-3.0-only
# SonarQube Cloud (plan 10.6, TF-143-06). Análise SEMPRE via CI (job `sonar-quality-gate`);
# a "Automatic Analysis" do SonarQube Cloud deve permanecer desativada (não importa cobertura).
# O token NUNCA fica aqui: vem de SONAR_TOKEN (GitHub Secrets) no `env` do step.
sonar.organization=earthw0rm
sonar.projectKey=EarthW0rm_one-drive-cleaner
sonar.projectName=one-drive-cleaner

sonar.sources=src/odc,frontend/src
sonar.tests=tests,frontend/src
sonar.test.inclusions=**/test_*.py,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/schema.gen.ts,src/odc/web/static/**,src/odc/storage/migrations/versions/**
sonar.sourceEncoding=UTF-8

# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.ruff.reportPaths=build/reports/ruff.json

# TypeScript (relatórios gerados por `make test-frontend` e `make lint-frontend`)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.eslint.reportPaths=build/reports/eslint.json
